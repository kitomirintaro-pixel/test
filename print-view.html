<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>SpinCoach — ファイルに保存</title>
    <style>
      :root {
        color-scheme: only light;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        padding: 0;
        background: #ffffff !important;
        color: #000000 !important;
        -webkit-text-fill-color: #000000 !important;
        font-family: "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Noto Sans JP", sans-serif;
      }
      .toolbar {
        position: sticky;
        top: 0;
        z-index: 10;
        display: flex;
        flex-wrap: wrap;
        gap: 0.5rem;
        align-items: center;
        padding: 0.75rem 1rem;
        background: #f3f4f6;
        border-bottom: 1px solid #d1d5db;
      }
      .toolbar p {
        margin: 0;
        flex: 1 1 100%;
        font-size: 0.9rem;
        color: #111 !important;
        -webkit-text-fill-color: #111 !important;
      }
      .toolbar button,
      .toolbar a {
        appearance: none;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 2.75rem;
        padding: 0.65rem 1rem;
        border-radius: 10px;
        font-size: 1rem;
        font-weight: 700;
        text-decoration: none;
        cursor: pointer;
      }
      .btn-save {
        border: none;
        background: #111;
        color: #fff !important;
        -webkit-text-fill-color: #fff !important;
      }
      .btn-save:disabled {
        opacity: 0.6;
        cursor: wait;
      }
      .btn-pdf {
        border: 1px solid #9ca3af;
        background: #fff;
        color: #111 !important;
        -webkit-text-fill-color: #111 !important;
      }
      .btn-pdf:disabled {
        opacity: 0.55;
        cursor: wait;
      }
      .btn-back {
        border: 1px solid #9ca3af;
        background: #fff;
        color: #111 !important;
        -webkit-text-fill-color: #111 !important;
      }
      #status {
        margin: 0;
        flex: 1 1 100%;
        font-size: 0.88rem;
        color: #065f46 !important;
        -webkit-text-fill-color: #065f46 !important;
      }
      #status.is-error {
        color: #b91c1c !important;
        -webkit-text-fill-color: #b91c1c !important;
      }
      #doc {
        padding: 1rem 1.1rem 2rem;
        background: #fff !important;
        color: #000 !important;
        -webkit-text-fill-color: #000 !important;
        font-size: 12pt;
        line-height: 1.55;
      }
      #doc,
      #doc * {
        color: #000000 !important;
        -webkit-text-fill-color: #000000 !important;
        opacity: 1 !important;
        text-shadow: none !important;
        background: transparent !important;
        box-shadow: none !important;
      }
      #doc h1 {
        font-size: 18pt;
        margin: 0 0 10pt;
      }
      #doc h2 {
        font-size: 13pt;
        margin: 14pt 0 6pt;
      }
      #empty {
        padding: 2rem 1rem;
        color: #111 !important;
      }
      @media print {
        .toolbar {
          display: none !important;
        }
        html,
        body,
        #doc {
          background: #fff !important;
          color: #000 !important;
          -webkit-text-fill-color: #000 !important;
        }
        #doc {
          padding: 0 !important;
        }
      }
    </style>
  </head>
  <body>
    <div class="toolbar no-print">
      <p>
        「印刷する」で共有シートが開きます。一覧の
        <strong>ファイルに保存</strong> を選ぶと、ファイルアプリに入ります。
      </p>
      <p id="status" hidden></p>
      <button type="button" class="btn-save" id="save-btn">印刷する</button>
      <button type="button" class="btn-pdf" id="pdf-btn" hidden disabled>PDFをファイルに保存</button>
      <a class="btn-back" id="back-link" href="./">アプリに戻る</a>
    </div>
    <div id="empty" hidden>
      保存用データがありません。アプリに戻って「印刷・PDF」からやり直してください。
    </div>
    <div id="doc"></div>
    <script>
      (function () {
        const html = sessionStorage.getItem("spincoach-print-html") || "";
        const plain = sessionStorage.getItem("spincoach-print-text") || "";
        const baseName =
          sessionStorage.getItem("spincoach-print-filename") || "SpinCoach-plan";
        const doc = document.getElementById("doc");
        const empty = document.getElementById("empty");
        const back = document.getElementById("back-link");
        const statusEl = document.getElementById("status");
        const saveBtn = document.getElementById("save-btn");
        const pdfBtn = document.getElementById("pdf-btn");
        const returnTo = sessionStorage.getItem("spincoach-print-return") || "./";
        back.setAttribute("href", returnTo);

        let pdfBlob = null;

        function setStatus(text, isError) {
          if (!text) {
            statusEl.hidden = true;
            statusEl.textContent = "";
            statusEl.classList.remove("is-error");
            return;
          }
          statusEl.hidden = false;
          statusEl.textContent = text;
          statusEl.classList.toggle("is-error", Boolean(isError));
        }

        function canShareFiles() {
          return Boolean(
            window.isSecureContext &&
              navigator.share &&
              navigator.canShare &&
              typeof File !== "undefined"
          );
        }

        function textContent() {
          return (plain || doc.innerText || "").trim();
        }

        function makeTextFile() {
          const body = textContent();
          if (!body) throw new Error("empty text");
          return new File([body], baseName + ".txt", {
            type: "text/plain",
            lastModified: Date.now(),
          });
        }

        async function shareFile(file) {
          if (!navigator.share) throw new Error("share unsupported");
          // canShare が false でも share が通る端末があるので、まず試す
          if (navigator.canShare) {
            try {
              if (!navigator.canShare({ files: [file] })) {
                throw new Error("canShare files false");
              }
            } catch (e) {
              // canShare 自体が例外の端末向けに、そのまま share を試す
              if (e && e.message === "canShare files false") throw e;
            }
          }
          await navigator.share({ files: [file], title: file.name });
        }

        function openBlobInBrowser(blob, filename) {
          const url = URL.createObjectURL(blob);
          setStatus(
            "ファイルを開きました。画面下の共有から「ファイルに保存」を選んでください。"
          );
          // 同一タブで開くと戻れる。新規タブはポップアップ阻害されやすい
          window.location.href = url;
          setTimeout(function () {
            URL.revokeObjectURL(url);
          }, 120000);
        }

        async function saveTextNow() {
          const file = makeTextFile();
          if (canShareFiles()) {
            await shareFile(file);
            setStatus("共有シートで「ファイルに保存」を選んでください。");
            return "shared";
          }
          // HTTP（ローカルIP）など共有不可な環境
          openBlobInBrowser(
            new Blob([await file.text()], { type: "text/plain" }),
            file.name
          );
          return "opened";
        }

        function loadScript(src) {
          return new Promise(function (resolve, reject) {
            if (window.html2pdf) {
              resolve();
              return;
            }
            var existing = document.querySelector('script[data-pdf-lib="1"]');
            if (existing) {
              existing.addEventListener("load", function () {
                resolve();
              });
              existing.addEventListener("error", function () {
                reject(new Error("script load failed"));
              });
              return;
            }
            var s = document.createElement("script");
            s.src = src;
            s.dataset.pdfLib = "1";
            s.onload = function () {
              resolve();
            };
            s.onerror = function () {
              reject(new Error("script load failed"));
            };
            document.head.appendChild(s);
          });
        }

        async function makePdfBlob() {
          await loadScript("vendor/html2pdf.bundle.min.js");
          if (typeof window.html2pdf !== "function") {
            throw new Error("html2pdf unavailable");
          }
          return window
            .html2pdf()
            .set({
              margin: [8, 8, 8, 8],
              filename: baseName + ".pdf",
              image: { type: "jpeg", quality: 0.72 },
              html2canvas: {
                scale: 1,
                backgroundColor: "#ffffff",
                logging: false,
                windowWidth: 640,
              },
              jsPDF: { unit: "mm", format: "a4", orientation: "portrait" },
              pagebreak: { mode: ["avoid-all"] },
              enableLinks: false,
            })
            .from(doc)
            .outputPdf("blob");
        }

        async function preparePdfInBackground() {
          pdfBtn.hidden = false;
          pdfBtn.disabled = true;
          pdfBtn.textContent = "PDF準備中…";
          try {
            const blob = await makePdfBlob();
            if (!(blob instanceof Blob) || blob.size < 64) {
              throw new Error("empty pdf");
            }
            pdfBlob = blob;
            pdfBtn.disabled = false;
            pdfBtn.textContent = "PDFをファイルに保存";
            setStatus("テキスト保存に加え、PDFでも保存できます。");
          } catch (err) {
            console.warn("pdf prep failed:", err);
            pdfBtn.hidden = true;
          }
        }

        async function onSaveClick() {
          saveBtn.disabled = true;
          setStatus("共有シートを開いています…");
          try {
            // 重要: PDF生成を待たず、タップ直後に共有する（iPhoneの操作切れ対策）
            await saveTextNow();
            // 共有後にPDFを裏で用意し、必要ならもう一度タップでPDF保存
            preparePdfInBackground();
          } catch (err) {
            if (err && err.name === "AbortError") {
              setStatus("キャンセルしました。");
            } else {
              console.warn("save failed:", err);
              try {
                const body = textContent();
                if (!body) throw new Error("empty");
                openBlobInBrowser(
                  new Blob([body], { type: "text/plain;charset=utf-8" }),
                  baseName + ".txt"
                );
              } catch (err2) {
                setStatus(
                  "この通信環境では共有できません。GitHubの公開ページ（https）で開くか、内容をコピーして保存してください。",
                  true
                );
              }
            }
          } finally {
            saveBtn.disabled = false;
          }
        }

        async function onPdfClick() {
          if (!pdfBlob) {
            setStatus("PDFの準備ができていません。少し待ってから押してください。", true);
            return;
          }
          pdfBtn.disabled = true;
          try {
            const file = new File([pdfBlob], baseName + ".pdf", {
              type: "application/pdf",
              lastModified: Date.now(),
            });
            if (canShareFiles()) {
              await shareFile(file);
              setStatus("共有シートで「ファイルに保存」を選んでください。");
            } else {
              openBlobInBrowser(pdfBlob, baseName + ".pdf");
            }
          } catch (err) {
            if (err && err.name === "AbortError") {
              setStatus("キャンセルしました。");
            } else {
              console.warn("pdf share failed:", err);
              openBlobInBrowser(pdfBlob, baseName + ".pdf");
            }
          } finally {
            pdfBtn.disabled = false;
          }
        }

        if (!html.trim()) {
          empty.hidden = false;
          doc.hidden = true;
          saveBtn.disabled = true;
          return;
        }

        doc.innerHTML = html;
        saveBtn.addEventListener("click", onSaveClick);
        pdfBtn.addEventListener("click", onPdfClick);
      })();
    </script>
  </body>
</html>
